<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tabata Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ─── Reset & Base ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --work-a:   #FF4D6D;
      --work-b:   #FF8C69;
      --rest-a:   #00D4FF;
      --rest-b:   #7B61FF;
      --prep-a:   #4169E1;
      --prep-b:   #00CFFD;
      --done-a:   #9B59B6;
      --done-b:   #6C3483;
      --bg-core:  #06060F;
      --glass-bg: rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.10);
      --text-primary: #FFFFFF;
      --text-muted:   rgba(255,255,255,0.5);
      --text-dim:     rgba(255,255,255,0.28);
      --accent: #FF4D6D;
      --easing-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --easing-smooth: cubic-bezier(0.4, 0, 0.2, 1);
      --radius-card: 24px;
      --radius-pill: 100px;
    }

    html, body {
      height: 100%;
      font-family: 'Space Grotesk', 'Inter', sans-serif;
      background: var(--bg-core);
      color: var(--text-primary);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Animated mesh background ─────────────────────────────────── */
    #bg-mesh {
      position: fixed;
      inset: 0;
      z-index: 0;
      transition: background 0.9s var(--easing-smooth);
    }
    #bg-mesh::before, #bg-mesh::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.35;
      transition: all 0.9s var(--easing-smooth);
    }
    #bg-mesh::before {
      width: 600px; height: 600px;
      top: -200px; left: -150px;
    }
    #bg-mesh::after {
      width: 500px; height: 500px;
      bottom: -180px; right: -100px;
    }

    /* Phase mesh colours are toggled via JS classes */
    body.phase-prepare #bg-mesh { background: radial-gradient(ellipse at 20% 20%, rgba(65,105,225,0.25) 0%, transparent 60%), radial-gradient(ellipse at 80% 80%, rgba(0,207,253,0.18) 0%, transparent 60%), var(--bg-core); }
    body.phase-prepare #bg-mesh::before { background: var(--prep-a); }
    body.phase-prepare #bg-mesh::after  { background: var(--prep-b); }

    body.phase-work #bg-mesh { background: radial-gradient(ellipse at 20% 20%, rgba(255,77,109,0.28) 0%, transparent 60%), radial-gradient(ellipse at 80% 80%, rgba(255,140,105,0.20) 0%, transparent 60%), var(--bg-core); }
    body.phase-work #bg-mesh::before { background: var(--work-a); }
    body.phase-work #bg-mesh::after  { background: var(--work-b); }

    body.phase-rest #bg-mesh { background: radial-gradient(ellipse at 20% 20%, rgba(0,212,255,0.25) 0%, transparent 60%), radial-gradient(ellipse at 80% 80%, rgba(123,97,255,0.20) 0%, transparent 60%), var(--bg-core); }
    body.phase-rest #bg-mesh::before { background: var(--rest-a); }
    body.phase-rest #bg-mesh::after  { background: var(--rest-b); }

    body.phase-done #bg-mesh { background: radial-gradient(ellipse at 50% 40%, rgba(155,89,182,0.30) 0%, transparent 60%), var(--bg-core); }
    body.phase-done #bg-mesh::before { background: var(--done-a); }
    body.phase-done #bg-mesh::after  { background: var(--done-b); }

    /* ─── App shell ─────────────────────────────────────────────────── */
    #app {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 32px;
      gap: 0;
    }

    /* ─── Header ───────────────────────────────────────────────────── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 28px;
      background: rgba(6,6,15,0.55);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
    }
    .logo {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #fff 0%, rgba(255,255,255,0.55) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo span {
      -webkit-text-fill-color: transparent;
      background: linear-gradient(90deg, var(--work-a), var(--work-b));
      -webkit-background-clip: text;
    }
    .header-badge {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      border: 1px solid var(--glass-border);
      padding: 4px 12px;
      border-radius: var(--radius-pill);
    }

    /* ─── Main layout ───────────────────────────────────────────────── */
    main {
      width: 100%;
      max-width: 920px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      margin-top: 80px;
    }

    /* ─── Phase label ───────────────────────────────────────────────── */
    #phase-label {
      font-size: clamp(0.85rem, 2vw, 1rem);
      font-weight: 600;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--text-muted);
      transition: color 0.6s var(--easing-smooth);
    }
    #phase-label.phase-work  { color: var(--work-a); }
    #phase-label.phase-rest  { color: var(--rest-a); }
    #phase-label.phase-prepare { color: var(--prep-b); }
    #phase-label.phase-done  { color: var(--done-a); }

    /* ─── Timer ring ─────────────────────────────────────────────────── */
    .ring-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #timer-ring {
      transform: rotate(-90deg);
      overflow: visible;
    }

    .ring-track {
      fill: none;
      stroke: rgba(255,255,255,0.07);
      stroke-width: 6;
    }

    .ring-progress {
      fill: none;
      stroke-width: 7;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.95s cubic-bezier(0.25,0.46,0.45,0.94),
                  stroke 0.6s var(--easing-smooth),
                  filter 0.6s var(--easing-smooth);
    }

    /* Outer glow ring */
    .ring-glow {
      fill: none;
      stroke-width: 18;
      stroke-linecap: round;
      opacity: 0;
      transition: opacity 0.6s, stroke 0.6s;
    }
    body.phase-work  .ring-glow { stroke: rgba(255,77,109,0.22);  opacity: 1; }
    body.phase-rest  .ring-glow { stroke: rgba(0,212,255,0.22);   opacity: 1; }
    body.phase-prepare .ring-glow { stroke: rgba(65,105,225,0.22); opacity: 1; }

    /* Timer digits */
    #timer-digits-group {
      transform: rotate(90deg);
    }
    #timer-seconds {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 88px;
      fill: #fff;
      text-anchor: middle;
      dominant-baseline: middle;
      transition: fill 0.5s;
      letter-spacing: -2px;
    }
    #timer-sub {
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 13px;
      fill: rgba(255,255,255,0.4);
      text-anchor: middle;
      dominant-baseline: middle;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* Pulsing dot when running */
    @keyframes pulse-dot {
      0%,100% { opacity: 0.6; r: 4; }
      50%      { opacity: 1;   r: 6; }
    }
    .live-dot {
      fill: var(--work-a);
      animation: pulse-dot 1.2s ease-in-out infinite;
      transition: fill 0.5s;
    }
    .live-dot.rest   { fill: var(--rest-a); }
    .live-dot.hidden { opacity: 0; animation: none; }

    /* ─── Round pips ────────────────────────────────────────────────── */
    #round-pips {
      display: flex;
      gap: 7px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 320px;
    }
    .pip {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      transition: background 0.4s var(--easing-smooth),
                  transform 0.35s var(--easing-bounce),
                  box-shadow 0.4s;
    }
    .pip.done {
      background: rgba(255,255,255,0.55);
    }
    .pip.current {
      background: #fff;
      transform: scale(1.45);
      box-shadow: 0 0 10px 2px rgba(255,255,255,0.55);
    }
    .pip.current.work {
      background: var(--work-a);
      box-shadow: 0 0 12px 3px rgba(255,77,109,0.65);
    }
    .pip.current.rest {
      background: var(--rest-a);
      box-shadow: 0 0 12px 3px rgba(0,212,255,0.65);
    }

    /* ─── Meta chips row ────────────────────────────────────────────── */
    .meta-row {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
    .chip {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: var(--radius-pill);
      padding: 6px 16px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      transition: color 0.4s, border-color 0.4s;
    }
    .chip strong { color: var(--text-primary); }

    /* ─── Controls ──────────────────────────────────────────────────── */
    .controls {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .btn-icon {
      width: 52px; height: 52px;
      border-radius: 50%;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      color: rgba(255,255,255,0.75);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.25s, transform 0.2s var(--easing-bounce), box-shadow 0.25s, border-color 0.25s;
      font-size: 20px;
    }
    .btn-icon:hover {
      background: rgba(255,255,255,0.10);
      transform: scale(1.08);
      border-color: rgba(255,255,255,0.22);
    }
    .btn-icon:active { transform: scale(0.94); }

    .btn-primary {
      width: 82px; height: 82px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px;
      position: relative;
      transition: transform 0.25s var(--easing-bounce), box-shadow 0.4s;
      outline: none;
    }
    .btn-primary::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--work-a), var(--work-b));
      z-index: -1;
      transition: background 0.6s, opacity 0.4s;
      opacity: 0.5;
      filter: blur(10px);
    }
    .btn-primary.rest::before { background: linear-gradient(135deg, var(--rest-a), var(--rest-b)); }

    .btn-primary-inner {
      width: 100%; height: 100%;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--work-a) 0%, var(--work-b) 100%);
      display: flex; align-items: center; justify-content: center;
      transition: background 0.6s var(--easing-smooth);
      box-shadow: 0 8px 32px rgba(255,77,109,0.45);
    }
    .btn-primary.rest .btn-primary-inner {
      background: linear-gradient(135deg, var(--rest-a) 0%, var(--rest-b) 100%);
      box-shadow: 0 8px 32px rgba(0,212,255,0.45);
    }
    .btn-primary.prepare .btn-primary-inner {
      background: linear-gradient(135deg, var(--prep-a) 0%, var(--prep-b) 100%);
      box-shadow: 0 8px 32px rgba(65,105,225,0.45);
    }
    .btn-primary:hover { transform: scale(1.08); }
    .btn-primary:active { transform: scale(0.95); }

    /* ─── Settings panel ────────────────────────────────────────────── */
    .settings-panel {
      width: 100%;
      max-width: 600px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: var(--radius-card);
      padding: 28px 32px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px 32px;
    }
    .settings-panel.hidden {
      display: none;
    }

    .setting-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .setting-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .setting-label .val {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
      min-width: 36px;
      text-align: right;
    }

    input[type=range] {
      width: 100%;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      border-radius: 4px;
      background: rgba(255,255,255,0.12);
      outline: none;
      cursor: pointer;
      transition: background 0.3s;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 8px rgba(255,255,255,0.5);
      cursor: pointer;
      transition: transform 0.2s var(--easing-bounce), box-shadow 0.2s;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.25);
      box-shadow: 0 0 14px rgba(255,255,255,0.75);
    }
    input[type=range]:focus {
      background: rgba(255,255,255,0.18);
    }

    .settings-full-row {
      grid-column: 1 / -1;
      display: flex;
      justify-content: center;
    }
    .btn-save {
      padding: 10px 36px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: background 0.25s, transform 0.2s var(--easing-bounce);
    }
    .btn-save:hover {
      background: rgba(255,255,255,0.15);
      transform: scale(1.04);
    }

    /* ─── Done overlay ──────────────────────────────────────────────── */
    #done-overlay {
      position: fixed; inset: 0; z-index: 200;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: rgba(6,6,15,0.80);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      opacity: 0; pointer-events: none;
      transition: opacity 0.5s;
    }
    #done-overlay.visible {
      opacity: 1; pointer-events: all;
    }
    .done-emoji { font-size: 72px; margin-bottom: 16px; }
    .done-title {
      font-size: clamp(2rem, 6vw, 3.5rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      background: linear-gradient(90deg, var(--done-a), var(--done-b));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .done-sub {
      color: var(--text-muted);
      font-size: 1rem;
      margin-bottom: 32px;
    }
    .btn-done {
      padding: 14px 40px;
      border-radius: var(--radius-pill);
      border: none;
      background: linear-gradient(135deg, var(--done-a), var(--done-b));
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s var(--easing-bounce), box-shadow 0.3s;
      box-shadow: 0 8px 32px rgba(155,89,182,0.45);
    }
    .btn-done:hover {
      transform: scale(1.06);
      box-shadow: 0 12px 40px rgba(155,89,182,0.6);
    }

    /* ─── Flash animation on phase change ──────────────────────────── */
    @keyframes phase-flash {
      0%   { opacity: 0.55; }
      100% { opacity: 0; }
    }
    #phase-flash {
      position: fixed; inset: 0; z-index: 100;
      pointer-events: none;
      opacity: 0;
    }
    #phase-flash.flash-work { animation: phase-flash 0.45s ease-out forwards; background: radial-gradient(ellipse at center, rgba(255,77,109,0.28) 0%, transparent 70%); }
    #phase-flash.flash-rest { animation: phase-flash 0.45s ease-out forwards; background: radial-gradient(ellipse at center, rgba(0,212,255,0.25) 0%, transparent 70%); }

    /* ─── Settings toggle button ────────────────────────────────────── */
    .btn-settings-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 18px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.25s, color 0.25s, transform 0.2s var(--easing-bounce);
    }
    .btn-settings-toggle:hover {
      background: rgba(255,255,255,0.09);
      color: #fff;
      transform: scale(1.04);
    }

    /* ─── Responsive ────────────────────────────────────────────────── */
    @media (max-width: 560px) {
      .settings-panel { grid-template-columns: 1fr; padding: 22px 20px; gap: 16px; }
      header { padding: 12px 18px; }
      #timer-seconds { font-size: 72px; }
    }
    @media (min-width: 900px) {
      main { flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 40px; margin-top: 100px; }
      .left-col  { display: flex; flex-direction: column; align-items: center; gap: 28px; }
      .right-col { display: flex; flex-direction: column; align-items: center; gap: 24px; padding-top: 12px; }
    }
  </style>
</head>
<body class="phase-prepare">
  <!-- Background mesh -->
  <div id="bg-mesh"></div>
  <!-- Phase flash on transition -->
  <div id="phase-flash"></div>

  <!-- Done overlay -->
  <div id="done-overlay">
    <div class="done-emoji">🔥</div>
    <div class="done-title">Session Complete</div>
    <div class="done-sub" id="done-sub-text">Well done — workout finished!</div>
    <button class="btn-done" onclick="resetAll()">Start Again</button>
  </div>

  <!-- Header -->
  <header>
    <div class="logo">Tabata<span>Clock</span></div>
    <div class="header-badge">Web Dashboard</div>
  </header>

  <!-- App -->
  <div id="app">
    <main id="main-layout">
      <!-- Left / center column -->
      <div class="left-col">
        <div id="phase-label">Ready</div>

        <!-- Ring -->
        <div class="ring-wrapper">
          <svg id="timer-ring" width="280" height="280" viewBox="0 0 280 280">
            <defs>
              <filter id="glow-work" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="6" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
              <filter id="glow-rest" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="6" result="blur"/>
                <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <circle class="ring-track" cx="140" cy="140" r="120"/>
            <circle class="ring-glow"    cx="140" cy="140" r="120" id="ring-glow-el"/>
            <circle class="ring-progress" cx="140" cy="140" r="120" id="ring-progress-el"
              stroke="#FF4D6D"
              stroke-dasharray="753.98"
              stroke-dashoffset="0"
              filter="url(#glow-work)"
            />
            <!-- Inner content group (counter-rotated) -->
            <g id="timer-digits-group" transform="rotate(90, 140, 140)">
              <text id="timer-seconds" x="140" y="132">20</text>
              <text id="timer-sub"     x="140" y="168">SECONDS</text>
              <circle class="live-dot hidden" id="live-dot" cx="140" cy="194" r="4"/>
            </g>
          </svg>
        </div>

        <!-- Round pips -->
        <div id="round-pips"></div>

        <!-- Meta chips -->
        <div class="meta-row">
          <div class="chip">Round <strong id="chip-round">—</strong></div>
          <div class="chip">Set <strong id="chip-set">—</strong></div>
          <div class="chip">Total <strong id="chip-total">—</strong></div>
        </div>

        <!-- Controls -->
        <div class="controls">
          <button class="btn-icon" id="btn-reset" title="Reset" onclick="resetAll()">&#8635;</button>
          <button class="btn-primary prepare" id="btn-play" onclick="handlePlayPause()">
            <div class="btn-primary-inner" id="btn-play-inner">
              <svg width="30" height="30" viewBox="0 0 24 24" fill="white" id="icon-play">
                <path d="M8 5v14l11-7z"/>
              </svg>
              <svg width="26" height="26" viewBox="0 0 24 24" fill="white" id="icon-pause" style="display:none">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
              </svg>
            </div>
          </button>
          <button class="btn-icon" id="btn-skip" title="Skip phase" onclick="skipPhase()">&#9178;</button>
        </div>
      </div>

      <!-- Right column -->
      <div class="right-col">
        <button class="btn-settings-toggle" onclick="toggleSettings()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.488.488 0 0 0-.59.22L2.74 8.87a.49.49 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
          Settings
        </button>

        <div class="settings-panel hidden" id="settings-panel">
          <div class="setting-group">
            <div class="setting-label">Prepare <span class="val" id="val-prepare">10s</span></div>
            <input type="range" id="sl-prepare" min="5" max="60" step="5" value="10">
          </div>
          <div class="setting-group">
            <div class="setting-label">Work <span class="val" id="val-work">20s</span></div>
            <input type="range" id="sl-work" min="10" max="120" step="5" value="20">
          </div>
          <div class="setting-group">
            <div class="setting-label">Rest <span class="val" id="val-rest">10s</span></div>
            <input type="range" id="sl-rest" min="5" max="60" step="5" value="10">
          </div>
          <div class="setting-group">
            <div class="setting-label">Rounds <span class="val" id="val-rounds">8</span></div>
            <input type="range" id="sl-rounds" min="1" max="20" step="1" value="8">
          </div>
          <div class="setting-group">
            <div class="setting-label">Sets <span class="val" id="val-sets">1</span></div>
            <input type="range" id="sl-sets" min="1" max="5" step="1" value="1">
          </div>
          <div class="setting-group">
            <div class="setting-label">Rest between sets <span class="val" id="val-setrest">60s</span></div>
            <input type="range" id="sl-setrest" min="10" max="120" step="10" value="60">
          </div>
          <div class="settings-full-row">
            <button class="btn-save" onclick="applySettings()">Apply & Reset</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    /* ─────────────────────────────────────────────────────────────────
       STATE
    ───────────────────────────────────────────────────────────────── */
    const PHASES = { PREPARE:'prepare', WORK:'work', REST:'rest', SET_REST:'set_rest', DONE:'done' };

    let cfg = {
      prepareSecs : 10,
      workSecs    : 20,
      restSecs    : 10,
      rounds      : 8,
      sets        : 1,
      setRestSecs : 60,
    };

    let state = buildInitialState();
    let intervalId = null;

    function buildInitialState() {
      return {
        phase       : PHASES.PREPARE,
        secondsLeft : cfg.prepareSecs,
        currentRound: 1,
        currentSet  : 1,
        isRunning   : false,
        isPaused    : false,
        totalRoundsCompleted: 0,
      };
    }

    /* ─────────────────────────────────────────────────────────────────
       TIMER LOGIC
    ───────────────────────────────────────────────────────────────── */
    function handlePlayPause() {
      if (state.phase === PHASES.DONE) { resetAll(); return; }
      if (state.isRunning) { pauseTimer(); }
      else { startOrResume(); }
    }

    function startOrResume() {
      state.isRunning = true;
      state.isPaused  = false;
      intervalId = setInterval(tick, 1000);
      render();
    }

    function pauseTimer() {
      state.isRunning = false;
      state.isPaused  = true;
      clearInterval(intervalId);
      render();
    }

    function tick() {
      if (state.secondsLeft > 0) {
        state.secondsLeft--;
        render();
      } else {
        advancePhase();
      }
    }

    function advancePhase() {
      const prev = state.phase;
      if (state.phase === PHASES.PREPARE) {
        state.phase = PHASES.WORK;
        state.secondsLeft = cfg.workSecs;
      } else if (state.phase === PHASES.WORK) {
        state.totalRoundsCompleted++;
        if (state.currentRound < cfg.rounds) {
          state.phase = PHASES.REST;
          state.secondsLeft = cfg.restSecs;
        } else if (state.currentSet < cfg.sets) {
          state.currentSet++;
          state.currentRound = 1;
          state.phase = PHASES.SET_REST;
          state.secondsLeft = cfg.setRestSecs;
        } else {
          state.phase = PHASES.DONE;
          state.isRunning = false;
          clearInterval(intervalId);
          showDone();
          render();
          return;
        }
      } else if (state.phase === PHASES.REST) {
        state.currentRound++;
        state.phase = PHASES.WORK;
        state.secondsLeft = cfg.workSecs;
      } else if (state.phase === PHASES.SET_REST) {
        state.phase = PHASES.WORK;
        state.secondsLeft = cfg.workSecs;
      }
      flashPhase(state.phase);
      render();
    }

    function skipPhase() {
      if (!state.isRunning && !state.isPaused) return;
      clearInterval(intervalId);
      state.secondsLeft = 0;
      advancePhase();
      if (state.isRunning) intervalId = setInterval(tick, 1000);
    }

    function resetAll() {
      clearInterval(intervalId);
      state = buildInitialState();
      hideDone();
      render();
    }

    /* ─────────────────────────────────────────────────────────────────
       SETTINGS
    ───────────────────────────────────────────────────────────────── */
    function toggleSettings() {
      document.getElementById('settings-panel').classList.toggle('hidden');
    }

    function applySettings() {
      cfg.prepareSecs = parseInt(document.getElementById('sl-prepare').value);
      cfg.workSecs    = parseInt(document.getElementById('sl-work').value);
      cfg.restSecs    = parseInt(document.getElementById('sl-rest').value);
      cfg.rounds      = parseInt(document.getElementById('sl-rounds').value);
      cfg.sets        = parseInt(document.getElementById('sl-sets').value);
      cfg.setRestSecs = parseInt(document.getElementById('sl-setrest').value);
      resetAll();
      document.getElementById('settings-panel').classList.add('hidden');
    }

    // Live slider label updates
    ['prepare','work','rest','setrest'].forEach(key => {
      const sl  = document.getElementById('sl-' + key);
      const val = document.getElementById('val-' + key);
      sl.addEventListener('input', () => val.textContent = sl.value + 's');
    });
    ['rounds','sets'].forEach(key => {
      const sl  = document.getElementById('sl-' + key);
      const val = document.getElementById('val-' + key);
      sl.addEventListener('input', () => val.textContent = sl.value);
    });

    /* ─────────────────────────────────────────────────────────────────
       RENDER
    ───────────────────────────────────────────────────────────────── */
    const CIRCUMFERENCE = 2 * Math.PI * 120; // r=120 → 753.98

    function phaseTotalSecs() {
      switch (state.phase) {
        case PHASES.PREPARE:  return cfg.prepareSecs;
        case PHASES.WORK:     return cfg.workSecs;
        case PHASES.REST:     return cfg.restSecs;
        case PHASES.SET_REST: return cfg.setRestSecs;
        default: return 1;
      }
    }

    function phaseStroke() {
      switch (state.phase) {
        case PHASES.WORK:     return ['#FF4D6D','#FF8C69','glow-work','work'];
        case PHASES.REST:     return ['#00D4FF','#7B61FF','glow-rest','rest'];
        case PHASES.PREPARE:  return ['#4169E1','#00CFFD','glow-work','prepare'];
        case PHASES.SET_REST: return ['#00D4FF','#7B61FF','glow-rest','rest'];
        default:              return ['#9B59B6','#6C3483','glow-work','done'];
      }
    }

    function render() {
      const progress = state.secondsLeft / phaseTotalSecs();
      const offset   = CIRCUMFERENCE * (1 - progress);
      const [c1, c2, filterId, phaseKey] = phaseStroke();

      // Ring
      const prog = document.getElementById('ring-progress-el');
      prog.style.stroke = `url(#grad-${phaseKey})` ;
      prog.setAttribute('stroke', c1);
      prog.style.strokeDashoffset = offset;
      prog.setAttribute('filter', `url(#${filterId})`);

      // Digits
      document.getElementById('timer-seconds').textContent =
        String(state.secondsLeft).padStart(2, '0');

      // Sub label
      const subLabels = { prepare:'PREPARE', work:'WORK', rest:'REST', set_rest:'SET REST', done:'DONE' };
      document.getElementById('timer-sub').textContent = subLabels[state.phase] || '';

      // Phase label
      const pl = document.getElementById('phase-label');
      pl.textContent = state.phase === PHASES.PREPARE ? 'Get Ready'
        : state.phase === PHASES.WORK     ? 'Work'
        : state.phase === PHASES.REST     ? 'Rest'
        : state.phase === PHASES.SET_REST ? 'Set Rest'
        : 'Done!';
      pl.className = 'phase-' + state.phase;

      // Body class (drives mesh)
      document.body.className = 'phase-' + (state.phase === PHASES.SET_REST ? 'rest' : state.phase);

      // Live dot
      const dot = document.getElementById('live-dot');
      if (state.isRunning) {
        dot.classList.remove('hidden');
        dot.className = 'live-dot ' + (state.phase === PHASES.REST || state.phase === PHASES.SET_REST ? 'rest' : '');
      } else {
        dot.classList.add('hidden');
      }

      // Play/pause icons
      document.getElementById('icon-play').style.display  = state.isRunning ? 'none'  : 'block';
      document.getElementById('icon-pause').style.display = state.isRunning ? 'block' : 'none';

      // Button phase colouring
      const playBtn = document.getElementById('btn-play');
      playBtn.className = 'btn-primary ' + (state.phase === PHASES.REST || state.phase === PHASES.SET_REST ? 'rest'
        : state.phase === PHASES.PREPARE ? 'prepare' : '');

      // Round pips
      renderPips();

      // Chips
      const totalRounds = cfg.rounds * cfg.sets;
      document.getElementById('chip-round').textContent =
        (state.phase === PHASES.DONE) ? cfg.rounds
        : state.currentRound + ' / ' + cfg.rounds;
      document.getElementById('chip-set').textContent  =
        state.currentSet + ' / ' + cfg.sets;
      document.getElementById('chip-total').textContent =
        state.totalRoundsCompleted + ' / ' + totalRounds;
    }

    function renderPips() {
      const container = document.getElementById('round-pips');
      container.innerHTML = '';
      const active = state.phase !== PHASES.PREPARE && state.phase !== PHASES.DONE;
      const max = Math.min(cfg.rounds, 20);
      for (let i = 1; i <= max; i++) {
        const pip = document.createElement('div');
        pip.className = 'pip';
        if (active) {
          if (i < state.currentRound) pip.classList.add('done');
          else if (i === state.currentRound) {
            pip.classList.add('current');
            pip.classList.add(state.phase === PHASES.REST ? 'rest' : 'work');
          }
        }
        container.appendChild(pip);
      }
    }

    function flashPhase(phase) {
      const el = document.getElementById('phase-flash');
      el.className = '';
      void el.offsetWidth; // reflow
      el.className = phase === PHASES.REST ? 'flash-rest' : 'flash-work';
    }

    function showDone() {
      const mins = Math.floor((cfg.workSecs * cfg.rounds * cfg.sets) / 60);
      const secs = (cfg.workSecs * cfg.rounds * cfg.sets) % 60;
      document.getElementById('done-sub-text').textContent =
        `${cfg.rounds * cfg.sets} rounds · ${mins}m ${secs}s work time`;
      document.getElementById('done-overlay').classList.add('visible');
    }
    function hideDone() {
      document.getElementById('done-overlay').classList.remove('visible');
    }

    /* ─── Keyboard shortcuts ─────────────────────────────────────── */
    document.addEventListener('keydown', e => {
      if (e.code === 'Space') { e.preventDefault(); handlePlayPause(); }
      if (e.code === 'KeyR')  resetAll();
      if (e.code === 'KeyS')  skipPhase();
    });

    /* ─── Init ───────────────────────────────────────────────────── */
    render();
  </script>
</body>
</html>
