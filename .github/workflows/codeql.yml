# CodeQL static analysis
# Language: kotlin (compiled — requires an actual build to extract the code graph)
#
# Schedule: weekly on Saturday at 03:00 Athens time (off-peak).
# On every push/PR to main: immediate scan so new code is never unscanned.

name: CodeQL Analysis

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '.github/dependabot.yml'
      - 'scripts/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '.github/dependabot.yml'
      - 'scripts/**'
  schedule:
    - cron: '0 0 * * 6'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'scheduled' || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (Kotlin)
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'kotlin' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate sound files
        run: python scripts/generate_sounds.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Bootstrap Gradle wrapper JAR
        run: |
          GRADLE_VERSION=9.5.1
          # Verify SHA-256 before executing — prevents MITM / CDN tampering.
          # Source: https://gradle.org/release-checksums/ (binary-only ZIP)
          EXPECTED_SHA256="bafc141b619ad6350fd975fc903156dd5c151998cc8b058e8c1044ab5f7b031f"
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
               -o /tmp/gradle.zip
          echo "${EXPECTED_SHA256}  /tmp/gradle.zip" | sha256sum --check --strict
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          /tmp/gradle-dist/gradle-${GRADLE_VERSION}/bin/gradle wrapper \
            --gradle-version ${GRADLE_VERSION} \
            --distribution-type bin
          chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "${KEYSTORE_BASE64}" | base64 --decode > app/tabata-release.keystore

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          config: |
            paths-ignore:
              - app/build
              - "**/*_HiltModules*"
              - "**/*_Factory*"
              - "**/*_MembersInjector*"
              - "**/*Hilt_*"
              - "**/ComposableSingletons*"

      - name: Build (CodeQL extraction)
        env:
          KEYSTORE_PATH: tabata-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Remove keystore
        if: always()
        run: rm -f app/tabata-release.keystore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: always
