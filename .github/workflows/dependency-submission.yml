# Submits the Gradle dependency graph to GitHub so that Dependabot
# can raise security alerts and version-update PRs.
#
# WHY NOT gradle/actions/dependency-submission@v4?
# ───────────────────────────────────────────────────
# That action invokes ./gradlew internally before our bootstrap step
# has placed gradle-wrapper.jar on disk, always failing with
# "Could not find or load main class org.gradle.wrapper.GradleWrapperMain".
# We bootstrap the JAR ourselves and use gradle/actions/setup-gradle
# with dependency-graph: generate-and-submit instead.
#
# WHY NOT GitHub's built-in Automatic Dependency Submission (Gradle)?
# ───────────────────────────────────────────────────
# Same root cause. Disable under: Settings → Security → Code security →
# Dependency graph → Automatic dependency submission for Gradle → OFF

name: Dependency Submission

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ── Python: generate sound WAV files ────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate sound files
        run: python scripts/generate_sounds.py

      # ── Java ─────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Bootstrap Gradle wrapper JAR ────────────────────────────────────────
      - name: Bootstrap Gradle wrapper JAR
        run: |
          GRADLE_VERSION=8.14.1
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
               -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          /tmp/gradle-dist/gradle-${GRADLE_VERSION}/bin/gradle wrapper \
            --gradle-version ${GRADLE_VERSION} \
            --distribution-type bin
          chmod +x gradlew

      # ── Setup Gradle (enables dependency graph generation + build scan) ──────
      # gradle/actions/setup-gradle@v4 ships Node 20 internally.
      # Force it to run on Node 24 to suppress the deprecation warning.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          dependency-graph: generate-and-submit
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      # ── Decode keystore ────────────────────────────────────────────
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/tabata-release.keystore

      # ── Resolve all dependencies ──────────────────────────────────────────
      - name: Resolve dependencies and submit graph
        env:
          KEYSTORE_PATH: tabata-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew \
            -Dorg.gradle.configureondemand=false \
            -Dorg.gradle.dependency.verification=off \
            :ForceDependencyResolutionPlugin_resolveAllDependencies \
            --stacktrace
