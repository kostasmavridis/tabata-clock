name: Android CI

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # ── Python: generate sound WAV files ───────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate sound files
        run: python scripts/generate_sounds.py

      # ── Java / Gradle ──────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Bootstrap Gradle wrapper JAR
        run: |
          GRADLE_VERSION=9.5.1
          # Verify SHA-256 before executing — prevents MITM / CDN tampering.
          # Source: https://gradle.org/release-checksums/ (binary-only ZIP)
          EXPECTED_SHA256="bafc141b619ad6350fd975fc903156dd5c151998cc8b058e8c1044ab5f7b031f"
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
               -o /tmp/gradle.zip
          echo "${EXPECTED_SHA256}  /tmp/gradle.zip" | sha256sum --check --strict
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          /tmp/gradle-dist/gradle-${GRADLE_VERSION}/bin/gradle wrapper \
            --gradle-version ${GRADLE_VERSION} \
            --distribution-type bin \
            --warning-mode all

      - name: Setup Gradle (caching)
        uses: gradle/actions/setup-gradle@v5
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── Decode keystore ───────────────────────────────────────────────────────────
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "${KEYSTORE_BASE64}" | base64 --decode > app/tabata-release.keystore

      # ── Verify keystore (no secret values printed) ─────────────────────────────
      - name: Verify keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          ls -la app/tabata-release.keystore
          keytool -list -keystore app/tabata-release.keystore \
            -storepass "${KEYSTORE_PASSWORD}" -storetype PKCS12

      # ── Tests ────────────────────────────────────────────────────────────────
      - name: Run unit tests
        run: ./gradlew test --stacktrace --rerun-tasks --warning-mode all --no-configuration-cache

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Generate Kover coverage report
        run: ./gradlew koverXmlReport --warning-mode all --no-configuration-cache

      - name: Upload coverage report
        uses: actions/upload-artifact@v7.0.1
        with:
          name: kover-coverage-report
          path: app/build/reports/kover/report.xml

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build debug APK
        env:
          KEYSTORE_PATH: tabata-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace --warning-mode all --no-configuration-cache

      # ── Cleanup ──────────────────────────────────────────────────────────────
      - name: Remove keystore
        if: always()
        run: rm -f app/tabata-release.keystore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tabata-clock-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # ── Gradle problems report ────────────────────────────────────────────────
      - name: Upload Gradle problems report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gradle-problems-report
          path: build/reports/problems/problems-report.html
          if-no-files-found: ignore
