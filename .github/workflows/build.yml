name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Python: generate sound WAV files ─────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate sound files
        run: python scripts/generate_sounds.py

      # ── Java / Gradle ─────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Bootstrap the wrapper JAR that was not committed (binary files
      # cannot be pushed via the GitHub Contents API as plain text).
      # gradle/actions/setup-gradle requires the JAR to already exist,
      # so we download Gradle manually first, run `gradle wrapper` to
      # regenerate the JAR, then hand off to the setup action for caching.
      - name: Bootstrap Gradle wrapper JAR
        run: |
          GRADLE_VERSION=8.7
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
               -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          /tmp/gradle-dist/gradle-${GRADLE_VERSION}/bin/gradle wrapper \
            --gradle-version ${GRADLE_VERSION} \
            --distribution-type bin

      - name: Setup Gradle (caching)
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── Tests ─────────────────────────────────────────────────────────────
      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Generate Kover coverage report
        run: ./gradlew koverXmlReport

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: kover-coverage-report
          path: app/build/reports/kover/report.xml

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabata-clock-debug
          path: app/build/outputs/apk/debug/app-debug.apk
