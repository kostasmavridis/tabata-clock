name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel any in-progress run for the same workflow + branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # ── Python: generate sound WAV files ───────────────────────
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate sound files
        run: python scripts/generate_sounds.py

      # ── Java / Gradle ────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Bootstrap Gradle wrapper JAR
        run: |
          GRADLE_VERSION=8.14.1
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
               -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          /tmp/gradle-dist/gradle-${GRADLE_VERSION}/bin/gradle wrapper \
            --gradle-version ${GRADLE_VERSION} \
            --distribution-type bin

      # gradle/actions/setup-gradle@v4 ships Node 20 internally.
      # Force it to run on Node 24 to suppress the deprecation warning.
      - name: Setup Gradle (caching)
        uses: gradle/actions/setup-gradle@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── Decode keystore ────────────────────────────────────
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/tabata-release.keystore

      # ── Debug signing ──────────────────────────────────
      - name: Debug signing config
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "KEY_ALIAS=[${KEY_ALIAS}]"
          ls -la app/tabata-release.keystore
          keytool -list -keystore app/tabata-release.keystore \
            -storepass "${KEYSTORE_PASSWORD}" -storetype PKCS12

      # ── Tests ───────────────────────────────────────────────
      - name: Run unit tests
        run: ./gradlew test --stacktrace --rerun-tasks

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Generate Kover coverage report
        run: ./gradlew koverXmlReport

      - name: Upload coverage report
        uses: actions/upload-artifact@v4.6.2
        with:
          name: kover-coverage-report
          path: app/build/reports/kover/report.xml

      # ── Build ───────────────────────────────────────────────
      - name: Build debug APK
        env:
          KEYSTORE_PATH: tabata-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: tabata-clock-debug
          path: app/build/outputs/apk/debug/app-debug.apk
