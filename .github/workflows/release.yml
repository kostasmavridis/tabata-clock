name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set version from tag
        id: version
        # Route github context through env to prevent script injection.
        env:
          GITHUB_REF_NAME: ${{ github.ref }}
        run: |
          TAG=${GITHUB_REF_NAME#refs/tags/}
          VERSION=${TAG#v}
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3 | cut -d- -f1)
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE"       >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate sound files
        run: python scripts/generate_sounds.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Bootstrap Gradle wrapper JAR
        run: |
          GRADLE_VERSION=9.5.1
          # Verify SHA-256 before executing — prevents MITM / CDN tampering.
          # Source: https://gradle.org/release-checksums/ (binary-only ZIP)
          EXPECTED_SHA256="bafc141b619ad6350fd975fc903156dd5c151998cc8b058e8c1044ab5f7b031f"
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
               -o /tmp/gradle.zip
          echo "${EXPECTED_SHA256}  /tmp/gradle.zip" | sha256sum --check --strict
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          /tmp/gradle-dist/gradle-${GRADLE_VERSION}/bin/gradle wrapper \
            --gradle-version ${GRADLE_VERSION} \
            --distribution-type bin
          chmod +x gradlew

      - name: Setup Gradle (caching)
        uses: gradle/actions/setup-gradle@v5
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "${KEYSTORE_BASE64}" | base64 --decode \
            > "${{ github.workspace }}/keystore.jks"

      - name: Build signed release APK & AAB
        # Pass credentials exclusively via env vars — -P project properties
        # are visible in /proc/*/cmdline to any co-tenant process on the runner.
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew \
            -PversionName="${VERSION_NAME}" \
            -PversionCode="${VERSION_CODE}" \
            assembleRelease bundleRelease \
            --no-configuration-cache --stacktrace

      - name: Remove keystore
        if: always()
        run: rm -f "${{ github.workspace }}/keystore.jks"

      - name: Rename artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             "app/build/outputs/apk/release/tabata-clock-${VERSION}.apk"
          mv app/build/outputs/bundle/release/app-release.aab \
             "app/build/outputs/bundle/release/tabata-clock-${VERSION}.aab"

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -z "$PREVIOUS_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREVIOUS_TAG}..HEAD"
          fi
          FEATURES=$(git log "$RANGE" --pretty=format:"- %s" --grep="^feat" | head -20)
          FIXES=$(git log "$RANGE" --pretty=format:"- %s" --grep="^fix" | head -20)
          OTHER=$(git log "$RANGE" --pretty=format:"- %s" --invert-grep --grep="^feat" --grep="^fix" | head -20)
          REPO="${{ github.repository }}"
          TAG="${{ steps.version.outputs.tag }}"
          {
            echo 'notes<<EOF'
            echo "## What's Changed"
            echo ""
            if [ -n "$FEATURES" ]; then
              echo "### ✨ New Features"
              echo "$FEATURES"
              echo ""
            fi
            if [ -n "$FIXES" ]; then
              echo "### 🐛 Bug Fixes"
              echo "$FIXES"
              echo ""
            fi
            if [ -n "$OTHER" ]; then
              echo "### 🔧 Other Changes"
              echo "$OTHER"
              echo ""
            fi
            echo "---"
            echo "**Full changelog:** https://github.com/${REPO}/compare/${PREVIOUS_TAG}...${TAG}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Tabata Clock ${{ steps.version.outputs.tag }}"
          body: ${{ steps.changelog.outputs.notes }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          files: |
            app/build/outputs/apk/release/tabata-clock-${{ steps.version.outputs.version }}.apk
            app/build/outputs/bundle/release/tabata-clock-${{ steps.version.outputs.version }}.aab
