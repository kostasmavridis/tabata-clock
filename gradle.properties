# Project-wide Gradle settings
# https://docs.gradle.org/current/userguide/build_environment.html

# Enable AndroidX — required by hilt-navigation-compose and all modern Jetpack libraries.
android.useAndroidX=true

# AGP 9.0 built-in Kotlin — replaces the org.jetbrains.kotlin.android plugin.
# KGP version is overridden in the root buildscript{} block to 2.2.21
# (above the AGP-bundled 2.2.10) until Hilt supports kotlin-metadata 2.3.0.
android.builtInKotlin=true

# Use AGP 9 new DSL interfaces exclusively (no legacy BaseExtension).
android.newDsl=true

# Kotlin code style
kotlin.code.style=official

# JVM heap for the Gradle daemon — Hilt + KSP annotation processing needs headroom
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Parallel task execution across subprojects
org.gradle.parallel=true

# Build caching: reuse outputs from prior identical inputs
org.gradle.caching=true
