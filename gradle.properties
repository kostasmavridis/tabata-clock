# Project-wide Gradle settings
# https://docs.gradle.org/current/userguide/build_environment.html

# Enable AndroidX — required by hilt-navigation-compose and all modern Jetpack libraries.
# Without this flag, AGP raises an error when it detects AndroidX dependencies.
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# JVM heap for the Gradle daemon
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Enable configuration caching for faster incremental builds
org.gradle.configuration-cache=true

# Enable parallel project execution
org.gradle.parallel=true

# Enable build caching
org.gradle.caching=true
