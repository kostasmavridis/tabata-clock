# Project-wide Gradle settings
# https://docs.gradle.org/current/userguide/build_environment.html

# Enable AndroidX — required by hilt-navigation-compose and all modern Jetpack libraries.
android.useAndroidX=true

# Suppress the compileSdk=35 / AGP compatibility warning.
# AGP 8.7.x is tested up to SDK 35; this line is a belt-and-suspenders
# fallback in case an older AGP version is resolved transitively.
android.suppressUnsupportedCompileSdk=35

# Kotlin code style
kotlin.code.style=official

# JVM heap for the Gradle daemon — Hilt + KSP annotation processing needs headroom
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Configuration caching: skip the configuration phase on unchanged builds
org.gradle.configuration-cache=true

# Parallel task execution across subprojects
org.gradle.parallel=true

# Build caching: reuse outputs from prior identical inputs
org.gradle.caching=true
