# Project-wide Gradle settings
# https://docs.gradle.org/current/userguide/build_environment.html

# Enable AndroidX — required by hilt-navigation-compose and all modern Jetpack libraries.
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# JVM heap for the Gradle daemon — Hilt + KSP annotation processing needs headroom
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# Parallel task execution across subprojects
org.gradle.parallel=true

# Build caching: reuse outputs from prior identical inputs
org.gradle.caching=true
